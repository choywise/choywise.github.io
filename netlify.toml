# Netlify configuration for the portfolio + AI Lab functions.
#
# The static site is copied into dist/ at build time so node_modules, the
# function sources and tooling are never published as static files.
# These settings take precedence over the build settings in the Netlify UI.

[build]
  command = "node scripts/build.mjs"
  publish = "dist"

[functions]
  directory = "server/functions"
  node_bundler = "esbuild"

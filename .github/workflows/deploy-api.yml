# Deploys the assistant API (server/functions) to Cloudflare Workers whenever
# the backend changes. The static site itself is served by GitHub Pages.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY
# Optional: AI_LAB_MODEL
name: Deploy assistant API

on:
  push:
    branches: [master, main]
    paths:
      - "server/**"
      - "worker/**"
      - "wrangler.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Backend tests (no model calls)
        run: npm run test:functions

      - name: Deploy worker
        run: npx wrangler deploy

      - name: Set worker secrets
        shell: bash
        run: |
          printf '%s' "${{ secrets.ANTHROPIC_API_KEY }}" | npx wrangler secret put ANTHROPIC_API_KEY
          if [ -n "${{ secrets.AI_LAB_MODEL }}" ]; then
            printf '%s' "${{ secrets.AI_LAB_MODEL }}" | npx wrangler secret put AI_LAB_MODEL
          fi

      - name: Next step
        run: |
          echo "Deployed. Your Worker URL is shown in the 'Deploy worker' step above"
          echo "(https://dancho-assistant-api.<subdomain>.workers.dev)."
          echo "Check <that URL>/api/health, then set window.ASSISTANT_API_BASE in index.html to it."
